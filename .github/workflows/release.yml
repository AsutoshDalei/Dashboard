name: Build and Release

on:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Test
        run: go test ./... -v -count=1

  build-and-release:
    if: contains(github.event.head_commit.message, 'version') || contains(github.event.head_commit.message, 'Version')
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Compute short SHA
        id: vars
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Download Tailwind CSS standalone CLI
        run: |
          curl -sL "https://github.com/tailwindlabs/tailwindcss/releases/download/v3.4.17/tailwindcss-linux-x64" -o tailwindcss
          chmod +x tailwindcss

      - name: Build Tailwind CSS
        run: ./tailwindcss -i web/static/input.css -o static/output.css --minify

      - name: Cross-compile for linux/arm64
        run: |
          BUILD_TIME=$(date -u +%Y-%m-%dT%H:%M:%SZ)
          COMMIT_HASH="${{ steps.vars.outputs.sha_short }}"
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build \
            -ldflags="-s -w -X main.buildTime=$BUILD_TIME -X main.commitHash=$COMMIT_HASH" \
            -o staging/pi_portfolio_arm64

      - name: Prepare staging directory
        run: |
          mkdir -p staging/templates
          cp templates/email_body.tmpl staging/templates/
          cp templates/coverletter.tex.tmpl staging/templates/
          cp templates/system_prompts.json staging/
          cp resume.tex staging/
          cp resume.md staging/
          cp pi_bundle/ASUTOSH_DALEI_RESUME.pdf staging/

      - name: Inject production .env
        run: echo "${{ secrets.PROD_ENV_FILE }}" > staging/.env

      - name: Inject Gmail API token
        run: echo "${{ secrets.GMAIL_TOKEN_JSON }}" > staging/token.json

      - name: Create tarball
        run: tar -czf myapp-linux-arm64.tar.gz -C staging .

      - name: Create Release and Upload Asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: release-${{ github.run_number }}-${{ steps.vars.outputs.sha_short }}
          name: "Release ${{ github.run_number }} (${{ steps.vars.outputs.sha_short }})"
          files: myapp-linux-arm64.tar.gz
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}