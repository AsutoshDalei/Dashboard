<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{block "title" .}}pi_dashboard{{end}}</title>
    <link rel="stylesheet" href="/static/output.css">
    <link rel="stylesheet" href="/static/zenith.css">
    <script>if(localStorage.getItem('sidebar_collapsed')==='true'){document.documentElement.setAttribute('data-sidebar','collapsed')}</script>
</head>
<body>
    <div class="dashboard-layout">
        <aside class="sidebar">
            <div class="sidebar-header">
                <button class="sidebar-toggle" type="button" aria-label="Toggle sidebar" aria-expanded="false">
                    <span></span><span></span><span></span>
                </button>
                <span class="sidebar-brand">pi_dashboard</span>
            </div>
            <nav class="sidebar-nav">
                <a href="/dashboard" class="nav-link {{if eq .Active "dashboard"}}active{{end}}">
                    <span class="nav-icon" aria-hidden="true">◉</span>
                    <span class="nav-text">Dashboard</span>
                </a>
                <a href="/tools/email" class="nav-link {{if eq .Active "email"}}active{{end}}">
                    <span class="nav-icon" aria-hidden="true">📧</span>
                    <span class="nav-text">Email Tool</span>
                </a>
                <a href="/tools/cover-letter" class="nav-link {{if eq .Active "coverletter"}}active{{end}}">
                    <span class="nav-icon" aria-hidden="true">📄</span>
                    <span class="nav-text">Cover Letter</span>
                </a>
                <a href="/tools/resume" class="nav-link {{if eq .Active "resume"}}active{{end}}">
                    <span class="nav-icon" aria-hidden="true">📝</span>
                    <span class="nav-text">Resume Tailor</span>
                </a>
                <a href="/tools/clipboard" class="nav-link {{if eq .Active "clipboard"}}active{{end}}">
                    <span class="nav-icon" aria-hidden="true">📋</span>
                    <span class="nav-text">Clipboard</span>
                </a>
                <a href="/tools/tracker" class="nav-link {{if eq .Active "tracker"}}active{{end}}">
                    <span class="nav-icon" aria-hidden="true">📊</span>
                    <span class="nav-text">Job Tracker</span>
                </a>
                <a href="/tools/chat" class="nav-link {{if eq .Active "chat"}}active{{end}}">
                    <span class="nav-icon" aria-hidden="true">💬</span>
                    <span class="nav-text">Chat</span>
                </a>
            </nav>
            <div class="sidebar-footer">
                <a href="/logout" class="nav-link" title="Logout">
                    <span class="nav-icon" aria-hidden="true">
                        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
                    </span>
                    <span class="nav-text">Logout</span>
                </a>
            </div>
        </aside>
        <div class="sidebar-backdrop" aria-hidden="true"></div>
        <main class="main-content">
            <div class="content-wrapper">
                {{block "content" .}}{{end}}
            </div>
        </main>
    </div>
    <script src="/static/sidebar.js" defer></script>
</body>
</html>
