{{define "sidebar"}}
<aside class="sidebar fixed top-0 left-0 h-full w-56 bg-surface-container border-r border-outline-variant z-40 transition-all duration-200 flex flex-col">
    <div class="sidebar-header flex items-center gap-3 px-4 py-3 border-b border-outline-variant">
        <button class="sidebar-toggle flex flex-col gap-1 p-1 bg-transparent border-none cursor-pointer" type="button" aria-label="Toggle sidebar" aria-expanded="false">
            <span class="block w-4 h-0.5 bg-on-surface-variant rounded"></span>
            <span class="block w-4 h-0.5 bg-on-surface-variant rounded"></span>
            <span class="block w-4 h-0.5 bg-on-surface-variant rounded"></span>
        </button>
        <span class="sidebar-brand text-sm font-semibold text-on-surface">Asutosh's Dashboard</span>
    </div>
    <nav class="sidebar-nav flex-1 px-3 py-4 space-y-1">
        <a href="/dashboard" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-high transition-colors no-underline text-sm {{if eq . "dashboard"}}active{{end}}">
            <span class="nav-icon w-5 text-center" aria-hidden="true">◉</span>
            <span class="nav-text">Dashboard</span>
        </a>
        <a href="/tools/email" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-high transition-colors no-underline text-sm {{if eq . "email"}}active{{end}}">
            <span class="nav-icon w-5 text-center" aria-hidden="true">📧</span>
            <span class="nav-text">Email Tool</span>
        </a>
        <a href="/tools/cover-letter" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-high transition-colors no-underline text-sm {{if eq . "coverletter"}}active{{end}}">
            <span class="nav-icon w-5 text-center" aria-hidden="true">📄</span>
            <span class="nav-text">Cover Letter</span>
        </a>
        <a href="/tools/resume" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-high transition-colors no-underline text-sm {{if eq . "resume"}}active{{end}}">
            <span class="nav-icon w-5 text-center" aria-hidden="true">📝</span>
            <span class="nav-text">Resume Tailor</span>
        </a>
        <a href="/tools/clipboard" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-high transition-colors no-underline text-sm {{if eq . "clipboard"}}active{{end}}">
            <span class="nav-icon w-5 text-center" aria-hidden="true">📋</span>
            <span class="nav-text">Clipboard</span>
        </a>
        <a href="/tools/tracker" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-high transition-colors no-underline text-sm {{if eq . "tracker"}}active{{end}}">
            <span class="nav-icon w-5 text-center" aria-hidden="true">📊</span>
            <span class="nav-text">Job Tracker</span>
        </a>
        <a href="/tools/jobposted" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-high transition-colors no-underline text-sm {{if eq . "jobposted"}}active{{end}}">
            <span class="nav-icon w-5 text-center" aria-hidden="true">🕐</span>
            <span class="nav-text">Job Posted</span>
        </a>
        <a href="/tools/chat" class="nav-link flex items-center gap-3 px-3 py-2 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-high transition-colors no-underline text-sm {{if eq . "chat"}}active{{end}}">
            <span class="nav-icon w-5 text-center" aria-hidden="true">💬</span>
            <span class="nav-text">Chat</span>
        </a>
    </nav>
    <div class="sidebar-footer px-1.5 py-1.5 border-t border-outline-variant">
        <a href="/logout" class="nav-link flex items-center gap-3 px-1.5 py-1 rounded-lg text-on-surface-variant hover:text-on-surface hover:bg-surface-high transition-colors no-underline text-sm" title="Logout">
            <span class="nav-icon w-5 text-center" aria-hidden="true">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </span>
            <span class="nav-text">Logout</span>
        </a>
    </div>
</aside>
<button class="mobile-menu-button mobile-menu-toggle md:hidden fixed left-3 top-3 z-50 flex h-10 w-10 items-center justify-center rounded-lg bg-surface-high text-on-surface shadow-lg border border-outline-variant" type="button" aria-label="Open menu" aria-expanded="false">
    <span class="block h-0.5 w-5 bg-on-surface rounded"></span>
    <span class="block h-0.5 w-5 bg-on-surface rounded mt-1"></span>
    <span class="block h-0.5 w-5 bg-on-surface rounded mt-1"></span>
</button>
<div class="sidebar-backdrop fixed inset-0 bg-black/50 z-30 hidden md:hidden" aria-hidden="true"></div>
{{end}}
