<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Asutosh's Portfolio - Login</title>
    <link rel="stylesheet" href="/static/zenith.css">
</head>
<body class="login-page">
    <main class="login-main">
        <div class="login-container">
            <div class="login-header">
                <h1 class="text-h1">Asutosh's Portfolio</h1>
            </div>
            
            <div class="login-card">
                <form id="loginForm" method="POST" action="/auth">
                    <div class="form-group">
                        <label class="form-label" for="passkey">Access Key</label>
                        <input 
                            type="password" 
                            id="passkey" 
                            name="passkey" 
                            class="form-input" 
                            placeholder="Enter your access key"
                            autocomplete="current-password"
                            required
                        >
                    </div>
                    
                    {{if .Error}}
                    <div class="status-message error show">
                        {{.Error}}
                    </div>
                    {{end}}
                    
                    <div class="mt-lg">
                        <button type="submit" class="btn btn-primary btn-full">
                            <span class="btn-text">Sign In</span>
                        </button>
                    </div>
                </form>
            </div>
        </div>
    </main>
    
    <footer class="footer">
        <div class="footer-copyright">
            &copy; 2024 Asutosh's Portfolio. Built for developers.
        </div>
        <div class="footer-links">
            <a href="#" class="footer-link">Privacy</a>
            <a href="#" class="footer-link">Terms</a>
            <a href="#" class="footer-link">Security</a>
            <a href="#" class="footer-link">Status</a>
        </div>
    </footer>
</body>
</html>
