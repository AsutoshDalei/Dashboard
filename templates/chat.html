<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - pi_dashboard</title>
    <link rel="stylesheet" href="/static/output.css">
    <script>if(localStorage.getItem('sidebar_collapsed')==='true'){document.documentElement.setAttribute('data-sidebar','collapsed')}</script>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen">
    <div class="dashboard-layout flex min-h-screen">
        {{template "sidebar" "chat"}}
        <main class="main-content flex-1 ml-56 min-h-screen transition-all duration-200 flex flex-col">
            <div class="flex flex-col h-[calc(100vh-0px)]">
                <div class="flex items-center gap-3 px-6 py-3 bg-surface-container border-b border-outline-variant">
                    <span class="px-2 py-1 rounded text-xs font-medium bg-surface-high text-on-surface-variant">📋 Application Assistant</span>
                    <span id="skillDesc" class="text-xs text-on-surface-muted flex-1">Drafts short, human-sounding job application responses.</span>
                    <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-surface-high text-on-surface-variant hover:text-on-surface hover:bg-surface-highest transition-colors border-none cursor-pointer" id="promptsToggle">Prompts</button>
                </div>

                <div id="promptsRow" class="hidden px-6 py-3 bg-surface-high border-b border-outline-variant">
                    <div class="flex gap-2 flex-wrap">
                        <span class="px-3 py-1.5 rounded-full text-xs bg-surface-container text-on-surface-variant border border-outline-variant cursor-pointer hover:bg-surface-highest transition-colors" id="addPromptBtn">+ Add Prompt</span>
                    </div>
                </div>

                <div id="chatMessages" class="flex-1 overflow-y-auto px-6 py-4 space-y-4">
                    <div id="emptyState" class="text-center py-16">
                        <div class="text-4xl mb-3">💬</div>
                        <p class="text-sm text-on-surface-muted">Ask me to draft a job application response based on your resume.</p>
                    </div>
                </div>

                <div class="px-6 py-4 bg-surface-container border-t border-outline-variant">
                    <div class="flex gap-3 items-end">
                        <textarea id="chatInput" class="flex-1 px-4 py-2.5 rounded-lg bg-surface-high text-on-surface border border-outline focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary placeholder:text-on-surface-muted text-sm resize-none" placeholder="e.g. Draft a response for 'Why do you want to work at Google?'" rows="1"></textarea>
                        <button class="btn-primary inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm font-medium bg-primary text-on-primary-container hover:brightness-110 transition-all duration-150 cursor-pointer border-none" id="sendBtn">
                            <span>Send</span>
                            <div class="btn-loader hidden w-4 h-4 border-2 border-on-primary-container border-t-transparent rounded-full animate-spin"></div>
                        </button>
                        <button class="px-3 py-2 rounded-lg text-xs font-medium bg-surface-high text-on-surface-variant hover:text-on-surface hover:bg-surface-highest transition-colors border-none cursor-pointer hidden" id="stopBtn">Stop</button>
                        <button class="px-3 py-2 rounded-lg text-xs font-medium bg-surface-high text-error hover:bg-error-soft transition-colors border-none cursor-pointer" id="clearBtn" title="Clear chat">✕</button>
                    </div>
                    <div class="mt-2 text-xs text-on-surface-muted">Enter to send · Shift+Enter for new line</div>
                </div>
            </div>
        </main>
    </div>
    <script>
    var chatMessages = document.getElementById('chatMessages');
    var chatInput = document.getElementById('chatInput');
    var sendBtn = document.getElementById('sendBtn');
    var stopBtn = document.getElementById('stopBtn');
    var clearBtn = document.getElementById('clearBtn');
    var emptyState = document.getElementById('emptyState');
    var promptsRow = document.getElementById('promptsRow');
    var promptsToggle = document.getElementById('promptsToggle');
    var abortController = null;

    // Auto-resize textarea
    chatInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 200) + 'px';
    });
    chatInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    promptsToggle.addEventListener('click', function() {
        promptsRow.classList.toggle('hidden');
    });

    function addMessage(role, content) {
        emptyState.style.display = 'none';
        var div = document.createElement('div');
        div.className = 'flex gap-3 ' + (role === 'user' ? 'justify-end' : 'justify-start');
        div.innerHTML = '<div class="max-w-[80%] px-4 py-2.5 rounded-xl text-sm ' +
            (role === 'user' ? 'bg-primary text-on-primary-container' : 'bg-surface-high text-on-surface') + '">' +
            '<div class="whitespace-pre-wrap">' + escapeHtml(content) + '</div></div>';
        div.dataset.role = role;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return div;
    }

    function showLoader() {
        var div = document.createElement('div');
        div.className = 'flex gap-3 justify-start';
        div.id = 'chatLoader';
        div.innerHTML = '<div class="px-4 py-2.5 rounded-xl text-sm bg-surface-high text-on-surface-muted"><div class="flex gap-1"><span class="w-2 h-2 bg-on-surface-muted rounded-full animate-bounce" style="animation-delay:0ms"></span><span class="w-2 h-2 bg-on-surface-muted rounded-full animate-bounce" style="animation-delay:150ms"></span><span class="w-2 h-2 bg-on-surface-muted rounded-full animate-bounce" style="animation-delay:300ms"></span></div></div>';
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeLoader() {
        var loader = document.getElementById('chatLoader');
        if (loader) loader.remove();
    }

    function sendMessage() {
        var text = chatInput.value.trim();
        if (!text || sendBtn.disabled) return;
        chatInput.value = '';
        chatInput.style.height = 'auto';
        addMessage('user', text);
        showLoader();
        sendBtn.disabled = true;
        stopBtn.classList.remove('hidden');
        abortController = new AbortController();
        fetch('/api/chat/send', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: text}),
            signal: abortController.signal
        }).then(function(r) { return r.json(); }).then(function(d) {
            removeLoader();
            if (d.success && d.data && d.data.response) {
                addMessage('assistant', d.data.response);
            } else {
                addMessage('assistant', 'Error: ' + (d.error || 'Unknown error'));
            }
        }).catch(function(err) {
            removeLoader();
            if (err.name !== 'AbortError') {
                addMessage('assistant', 'Error: ' + err.message);
            }
        }).finally(function() {
            sendBtn.disabled = false;
            stopBtn.classList.add('hidden');
            abortController = null;
        });
    }

    stopBtn.addEventListener('click', function() {
        if (abortController) { abortController.abort(); }
    });

    sendBtn.addEventListener('click', sendMessage);

    clearBtn.addEventListener('click', function() {
        if (abortController) abortController.abort();
        chatMessages.querySelectorAll('[data-role]').forEach(function(el) { el.remove(); });
        emptyState.style.display = 'block';
        fetch('/api/chat/clear', {method: 'POST'});
    });
    </script>
    <script src="/static/sidebar.js" defer></script>
</body>
</html>
