<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chat - Asutosh's Dashboard</title>
    <link rel="stylesheet" href="/static/output.css">
    <script>if(localStorage.getItem('sidebar_collapsed')==='true'){document.documentElement.setAttribute('data-sidebar','collapsed')}</script>
    <style>.preload,.preload *{transition:none!important}html[data-sidebar="collapsed"] .sidebar{width:3.5rem!important;transform:translateX(0)!important}html[data-sidebar="collapsed"] .sidebar .nav-text,html[data-sidebar="collapsed"] .sidebar .sidebar-brand,html[data-sidebar="collapsed"] .sidebar .sidebar-footer .nav-text{display:none!important}html[data-sidebar="collapsed"] .sidebar .sidebar-header{justify-content:center}html[data-sidebar="collapsed"] .sidebar .sidebar-header,html[data-sidebar="collapsed"] .sidebar .sidebar-nav{padding-left:.75rem!important;padding-right:.75rem!important}html[data-sidebar="collapsed"] .sidebar .nav-link{justify-content:center;padding-left:.5rem!important;padding-right:.5rem!important}html[data-sidebar="collapsed"] .main-content{margin-left:3.5rem!important}</style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen overflow-x-hidden">
    <div class="dashboard-layout flex min-h-screen">
        {{template "sidebar" "chat"}}
        <main class="main-content flex-1 ml-56 min-h-screen transition-all duration-200 flex flex-col min-w-0">
            <div class="flex flex-col h-[calc(100vh-0px)]">
                <div class="flex items-center gap-3 px-6 py-3 bg-surface-container border-b border-outline-variant">
                    <span class="px-2 py-1 rounded text-xs font-medium bg-surface-high text-on-surface-variant">📋 Application Assistant</span>
                    <span id="skillDesc" class="text-xs text-on-surface-muted flex-1">Drafts short, human-sounding job application responses.</span>
                    <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-surface-high text-on-surface-variant hover:text-on-surface hover:bg-surface-highest transition-colors border-none cursor-pointer" id="promptsToggle">Prompts</button>
                    <button class="px-3 py-1.5 rounded-lg text-xs font-medium bg-surface-high text-on-surface-variant hover:text-on-surface hover:bg-surface-highest transition-colors border-none cursor-pointer" id="clearChatBtn">Clear</button>
                </div>

                <div id="promptsRow" class="hidden px-6 py-3 bg-surface-high border-b border-outline-variant">
                    <div class="flex gap-2 flex-wrap">
                        <span class="px-3 py-1.5 rounded-full text-xs bg-surface-container text-on-surface-variant border border-outline-variant cursor-pointer hover:bg-surface-highest transition-colors" id="addPromptBtn">+ Add Prompt</span>
                    </div>
                </div>

                <div id="chatMessages" class="flex-1 overflow-y-auto px-6 py-4 space-y-4">
                    <div id="emptyState" class="text-center py-16">
                        <div class="text-4xl mb-3">💬</div>
                        <p class="text-sm text-on-surface-muted">Ask me to draft a job application response based on your resume.</p>
                    </div>
                </div>

                <div class="px-6 py-4 bg-surface-container border-t border-outline-variant">
                    <div class="flex gap-3 items-end">
                        <textarea id="chatInput" class="flex-1 px-4 py-2.5 rounded-lg bg-surface-high text-on-surface border border-outline focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary placeholder:text-on-surface-muted text-sm resize-none" placeholder="e.g. Draft a response for 'Why do you want to work at Google?'" rows="1"></textarea>
                        <button class="btn-primary inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm font-medium bg-primary text-on-primary-container hover:brightness-110 transition-all duration-150 cursor-pointer border-none" id="sendBtn">
                            <span>Send</span>
                            <div class="btn-loader hidden w-4 h-4 border-2 border-on-primary-container border-t-transparent rounded-full animate-spin"></div>
                        </button>
                        <button class="px-3 py-2 rounded-lg text-xs font-medium bg-surface-high text-on-surface-variant hover:text-on-surface hover:bg-surface-highest transition-colors border-none cursor-pointer hidden" id="stopBtn">Stop</button>
                    </div>
                    <div class="mt-2 text-xs text-on-surface-muted">Enter to send · Shift+Enter for new line</div>
                </div>
            </div>
        </main>
    </div>
    <script>
    var chatMessages = document.getElementById('chatMessages');
    var chatInput = document.getElementById('chatInput');
    var sendBtn = document.getElementById('sendBtn');
    var stopBtn = document.getElementById('stopBtn');
    var emptyState = document.getElementById('emptyState');
    var promptsRow = document.getElementById('promptsRow');
    var promptsToggle = document.getElementById('promptsToggle');
    var chatHistory = JSON.parse(localStorage.getItem('chat_history') || '[]');
    var currentAbortController = null;

    function saveChatHistory() {
        localStorage.setItem('chat_history', JSON.stringify(chatHistory));
    }

    function loadChatHistory() {
        if (chatHistory.length === 0) return;
        emptyState.style.display = 'none';
        chatHistory.forEach(function(msg) {
            addMessage(msg.role, msg.content);
        });
    }

    loadChatHistory();

    // Auto-resize textarea
    chatInput.addEventListener('input', function() {
        this.style.height = 'auto';
        this.style.height = Math.min(this.scrollHeight, 200) + 'px';
    });
    chatInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
    });

    promptsToggle.addEventListener('click', function() {
        promptsRow.classList.toggle('hidden');
    });

    function escapeHtml(text) {
        var div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    function renderMarkdown(text) {
        var html = text;
        html = html.replace(/```([\s\S]*?)```/g, '<pre><code>$1</code></pre>');
        html = html.replace(/`(.+?)`/g, '<code>$1</code>');
        html = html.replace(/^#{6}(?=[^#])\s*(.+)$/gm, '<h6>$1</h6>');
        html = html.replace(/^#{5}(?=[^#])\s*(.+)$/gm, '<h5>$1</h5>');
        html = html.replace(/^#{4}(?=[^#])\s*(.+)$/gm, '<h4>$1</h4>');
        html = html.replace(/^#{3}(?=[^#])\s*(.+)$/gm, '<h3>$1</h3>');
        html = html.replace(/^#{2}(?=[^#])\s*(.+)$/gm, '<h2>$1</h2>');
        html = html.replace(/^#(?=[^#])\s*(.+)$/gm, '<h1>$1</h1>');
        html = html.replace(/\*\*\*(.+?)\*\*\*/g, '<strong><em>$1</em></strong>');
        html = html.replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>');
        html = html.replace(/\*(.+?)\*/g, '<em>$1</em>');
        var lines = html.split('\n');
        var result = [];
        var i = 0;
        while (i < lines.length) {
            if (lines[i].trim().startsWith('|') && i + 1 < lines.length && /^\|[\s\-:|]+\|$/.test(lines[i + 1].trim())) {
                var headers = lines[i].trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function(c) { return c.trim(); });
                i += 2;
                var rows = [];
                while (i < lines.length && lines[i].trim().startsWith('|')) {
                    rows.push(lines[i].trim().replace(/^\|/, '').replace(/\|$/, '').split('|').map(function(c) { return c.trim(); }));
                    i++;
                }
                var table = '<table class="markdown-table"><thead><tr>';
                headers.forEach(function(h) { table += '<th>' + h + '</th>'; });
                table += '</tr></thead><tbody>';
                rows.forEach(function(row) {
                    table += '<tr>';
                    row.forEach(function(cell) { table += '<td>' + cell + '</td>'; });
                    table += '</tr>';
                });
                table += '</tbody></table>';
                result.push(table);
            } else {
                result.push(lines[i]);
                i++;
            }
        }
        html = result.join('\n');
        html = html.split('\n\n').map(function(p) {
            return p.trim() ? '<p>' + p.trim().replace(/\n/g, '<br>') + '</p>' : '';
        }).join('');
        var temp = document.createElement('div');
        temp.innerHTML = html;
        var paragraphs = temp.querySelectorAll('p');
        paragraphs.forEach(function(p) {
            if (!p.innerHTML.trim()) p.remove();
        });
        return temp.innerHTML;
    }

    function addMessage(role, content) {
        emptyState.style.display = 'none';
        var div = document.createElement('div');
        div.className = 'flex gap-3 ' + (role === 'user' ? 'justify-end' : 'justify-start');
        var contentHtml = role === 'user' ? escapeHtml(content) : renderMarkdown(content);
        div.innerHTML = '<div class="max-w-[80%] px-4 py-2.5 rounded-xl text-sm ' +
            (role === 'user' ? 'bg-primary text-on-primary-container' : 'bg-surface-high text-on-surface') + '">' +
            '<div class="markdown-content">' + contentHtml + '</div></div>';
        div.dataset.role = role;
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
        return div;
    }

    function updateMessageContent(div, content) {
        var markdownDiv = div.querySelector('.markdown-content');
        if (markdownDiv) {
            markdownDiv.innerHTML = renderMarkdown(content);
        }
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function showLoader() {
        removeLoader();
        var div = document.createElement('div');
        div.className = 'flex gap-3 justify-start';
        div.id = 'chatLoader';
        div.innerHTML = '<div class="px-4 py-2.5 rounded-xl text-sm bg-surface-high text-on-surface-muted"><div class="flex gap-1"><span class="w-2 h-2 bg-on-surface-muted rounded-full animate-bounce" style="animation-delay:0ms"></span><span class="w-2 h-2 bg-on-surface-muted rounded-full animate-bounce" style="animation-delay:150ms"></span><span class="w-2 h-2 bg-on-surface-muted rounded-full animate-bounce" style="animation-delay:300ms"></span></div></div>';
        chatMessages.appendChild(div);
        chatMessages.scrollTop = chatMessages.scrollHeight;
    }

    function removeLoader() {
        var loader = document.getElementById('chatLoader');
        if (loader) loader.remove();
    }

    function sendMessage() {
        var text = chatInput.value.trim();
        if (!text || sendBtn.disabled) return;
        chatInput.value = '';
        chatInput.style.height = 'auto';
        addMessage('user', text);
        chatHistory.push({role: 'user', content: text});
        saveChatHistory();
        showLoader();
        sendBtn.disabled = true;
        stopBtn.classList.remove('hidden');

        currentAbortController = new AbortController();

        fetch('/api/chat/send?stream=true', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({message: text}),
            signal: currentAbortController.signal
        }).then(function(response) {
            var reader = response.body.getReader();
            var decoder = new TextDecoder();
            var buffer = '';
            var currentEvent = '';
            var messageDiv = null;
            var fullResponse = '';

            function processChunk() {
                return reader.read().then(function(result) {
                    if (result.done) {
                        finishStream();
                        return;
                    }
                    buffer += decoder.decode(result.value, {stream: true});
                    var lines = buffer.split('\n');
                    buffer = lines.pop() || '';
                    for (var i = 0; i < lines.length; i++) {
                        var line = lines[i];
                        if (line.startsWith('event: ')) {
                            currentEvent = line.substring(7).trim();
                        } else if (line.startsWith('data: ')) {
                            var data = line.substring(6);
                            handleEvent(currentEvent, data);
                        }
                    }
                    return processChunk();
                });
            }

            function handleEvent(event, data) {
                if (event === 'thinking') {
                    return;
                }
                if (event === 'message') {
                    if (!messageDiv) {
                        removeLoader();
                        messageDiv = addMessage('assistant', '');
                    }
                    try {
                        var parsed = JSON.parse(data);
                        fullResponse += parsed;
                        updateMessageContent(messageDiv, fullResponse);
                    } catch(e) {
                        fullResponse += data;
                        updateMessageContent(messageDiv, fullResponse);
                    }
                }
                if (event === 'error') {
                    removeLoader();
                    addMessage('assistant', 'Error: ' + data);
                    sendBtn.disabled = false;
                    stopBtn.classList.add('hidden');
                    currentAbortController = null;
                    return;
                }
                if (event === 'done') {
                    finishStream();
                }
            }

            function finishStream() {
                removeLoader();
                sendBtn.disabled = false;
                stopBtn.classList.add('hidden');
                currentAbortController = null;
                if (fullResponse) {
                    chatHistory.push({role: 'assistant', content: fullResponse});
                    saveChatHistory();
                }
            }

            return processChunk();
        }).catch(function(err) {
            if (err.name === 'AbortError') {
                removeLoader();
                sendBtn.disabled = false;
                stopBtn.classList.add('hidden');
                currentAbortController = null;
                return;
            }
            removeLoader();
            sendBtn.disabled = false;
            stopBtn.classList.add('hidden');
            currentAbortController = null;
            addMessage('assistant', 'Error: Connection failed');
        });
    }

    stopBtn.addEventListener('click', function() {
        if (currentAbortController) {
            currentAbortController.abort();
            currentAbortController = null;
        }
        removeLoader();
        sendBtn.disabled = false;
        stopBtn.classList.add('hidden');
    });

    document.getElementById('clearChatBtn').addEventListener('click', function() {
        fetch('/api/chat/clear', { method: 'POST' });
        localStorage.removeItem('chat_history');
        chatHistory = [];
        chatMessages.innerHTML = '';
        chatMessages.appendChild(emptyState);
        emptyState.style.display = '';
    });

    sendBtn.addEventListener('click', sendMessage);
    </script>
    <script src="/static/sidebar.js" defer></script>
</body>
</html>
