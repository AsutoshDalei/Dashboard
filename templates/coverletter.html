<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cover Letter Generator - Asutosh's Dashboard</title>
    <link rel="stylesheet" href="/static/output.css">
    <script>if(localStorage.getItem('sidebar_collapsed')==='true'){document.documentElement.setAttribute('data-sidebar','collapsed')}</script>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen">
    <div class="dashboard-layout flex min-h-screen">
        {{template "sidebar" "coverletter"}}
        <main class="main-content flex-1 ml-56 min-h-screen transition-all duration-200">
            <div class="content-wrapper max-w-3xl mx-auto px-6 py-8">
                <header class="page-header mb-8">
                    <h1 class="page-title text-2xl font-bold text-on-surface">Cover Letter Generator</h1>
                    <p class="page-subtitle text-on-surface-muted mt-1">Generate a personalized cover letter PDF for your job applications.</p>
                </header>

                <div class="bg-surface-container rounded-xl p-6 border border-outline-variant">
                    <div class="mb-6">
                        <h2 class="text-lg font-semibold text-on-surface">Generate PDF</h2>
                        <p class="text-sm text-on-surface-muted mt-1">Enter the company name to generate a customized cover letter.</p>
                    </div>
                    <form id="coverLetterForm">
                        <div class="mb-6">
                            <label class="block text-sm font-medium text-on-surface-variant mb-1" for="companyName">Company Name</label>
                            <input type="text" id="companyName" class="w-full px-3 py-2 rounded-lg bg-surface-high text-on-surface border border-outline focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary placeholder:text-on-surface-muted text-sm" placeholder="e.g. Google, OpenAI, Stripe" autocomplete="off" required>
                        </div>
                        <button type="submit" id="submitBtn" class="w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm font-medium bg-primary text-on-primary-container hover:brightness-110 transition-all duration-150 cursor-pointer border-none">
                            <span class="btn-text">Generate Cover Letter</span>
                            <div class="btn-loader hidden w-4 h-4 border-2 border-on-primary-container border-t-transparent rounded-full animate-spin"></div>
                        </button>
                    </form>
                    <div id="statusMessage" class="mt-4 px-4 py-3 rounded-lg text-sm hidden"></div>
                </div>
            </div>
        </main>
    </div>
    <script>
    document.getElementById('coverLetterForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var btn = document.getElementById('submitBtn');
        var status = document.getElementById('statusMessage');
        var loader = btn.querySelector('.btn-loader');
        btn.querySelector('.btn-text').textContent = 'Generating...';
        loader.classList.remove('hidden');
        btn.disabled = true;
        status.className = 'mt-4 px-4 py-3 rounded-lg text-sm hidden';
        fetch('/generate-cover-letter', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({company: document.getElementById('companyName').value})
        }).then(function(r) {
            if (!r.ok) { return r.json().then(function(d) { throw new Error(d.error || 'Failed'); }); }
            var disposition = r.headers.get('Content-Disposition') || '';
            var match = disposition.match(/filename="?([^";\n]+)"?/);
            var filename = match ? match[1] : 'cover_letter.pdf';
            return r.blob().then(function(blob) {
                var a = document.createElement('a');
                a.href = URL.createObjectURL(blob);
                a.download = filename;
                a.click();
                URL.revokeObjectURL(a.href);
                status.className = 'mt-4 px-4 py-3 rounded-lg text-sm bg-success-soft text-success';
                status.textContent = 'PDF downloaded successfully!';
                status.classList.remove('hidden');
            });
        }).catch(function(err) {
            status.className = 'mt-4 px-4 py-3 rounded-lg text-sm bg-error-soft text-error';
            status.textContent = err.message || 'Failed to generate cover letter.';
            status.classList.remove('hidden');
        }).finally(function() {
            btn.querySelector('.btn-text').textContent = 'Generate Cover Letter';
            loader.classList.add('hidden');
            btn.disabled = false;
        });
    });
    </script>
    <script src="/static/sidebar.js" defer></script>
</body>
</html>
