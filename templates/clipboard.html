<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipboard - Asutosh's Portfolio</title>
    <link rel="stylesheet" href="/static/zenith.css">
    <style>
        .clipboard-container {
            display: flex;
            flex-direction: column;
            gap: var(--space-xl);
        }
        
        .add-item-card {
            background: rgba(24, 24, 27, 0.5);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: var(--space-xl);
        }
        
        .add-item-header {
            margin-bottom: var(--space-lg);
        }
        
        .add-item-title {
            font-size: 20px;
            font-weight: 600;
            color: var(--on-surface);
            margin: 0 0 var(--space-xs) 0;
        }
        
        .add-item-subtitle {
            font-size: 14px;
            color: var(--on-surface-variant);
            margin: 0;
        }
        
        .add-item-form {
            display: flex;
            flex-direction: column;
            gap: var(--space-md);
        }
        
        .form-row {
            display: flex;
            gap: var(--space-md);
        }
        
        .form-row .form-group {
            flex: 1;
            margin-bottom: 0;
        }
        
        .form-row .form-group:first-child {
            flex: 0.4;
        }
        
        .items-list {
            display: flex;
            flex-direction: column;
            gap: var(--space-sm);
        }
        
        .clipboard-item {
            background: rgba(24, 24, 27, 0.5);
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: var(--space-md) var(--space-lg);
            display: flex;
            align-items: center;
            gap: var(--space-md);
            transition: border-color 0.2s ease, background-color 0.2s ease;
        }
        
        .clipboard-item:hover {
            border-color: var(--outline);
            background: #18181b;
        }
        
        .item-info {
            flex: 1;
            min-width: 0;
            overflow: hidden;
        }
        
        .item-label {
            font-size: 14px;
            font-weight: 500;
            color: var(--on-surface);
            margin: 0 0 var(--space-xs) 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        
        .item-content {
            font-size: 12px;
            color: var(--on-surface-muted);
            margin: 0;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
        }
        
        .item-actions {
            display: flex;
            align-items: center;
            gap: var(--space-sm);
            flex-shrink: 0;
        }
        
        .btn-icon-only {
            width: 36px;
            height: 36px;
            padding: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: var(--radius-md);
            border: 1px solid var(--border);
            background: var(--surface-high);
            color: var(--on-surface-variant);
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 14px;
            line-height: 1;
        }
        
        .btn-icon-only:hover {
            background: #3f3f46;
            color: var(--on-surface);
            border-color: var(--outline);
        }
        
        .btn-icon-only.btn-copy:hover {
            background: var(--primary-container);
            color: white;
            border-color: var(--primary-container);
        }
        
        .btn-icon-only.btn-delete:hover {
            background: var(--error);
            color: white;
            border-color: var(--error);
        }
        
        .btn-icon-only.copied {
            background: var(--success);
            color: white;
            border-color: var(--success);
        }

        .btn-icon-only:disabled,
        .btn-icon-only[disabled] {
            opacity: 0.35;
            cursor: not-allowed;
            background: transparent;
            color: var(--on-surface-muted);
            border-color: var(--border);
        }

        .btn-icon-only.btn-move:hover:not(:disabled) {
            color: var(--on-surface);
        }
        
        .empty-state {
            text-align: center;
            padding: var(--space-3xl) var(--space-xl);
            color: var(--on-surface-muted);
        }
        
        .empty-state-icon {
            font-size: 48px;
            margin-bottom: var(--space-md);
            opacity: 0.5;
        }
        
        .empty-state-text {
            font-size: 14px;
            margin: 0;
        }
        
        .items-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: var(--space-md);
        }
        
        .items-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--on-surface);
            margin: 0;
        }
        
        .items-count {
            font-size: 14px;
            color: var(--on-surface-muted);
        }
        
        @media (max-width: 640px) {
            .form-row {
                flex-direction: column;
            }
            
            .form-row .form-group:first-child {
                flex: 1;
            }
        }
    </style>
</head>
<body>
    <div class="dashboard-layout">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="sidebar-header">
                <span class="sidebar-brand">Asutosh's Portfolio</span>
            </div>
            
            <nav class="sidebar-nav">
                <a href="/dashboard" class="nav-link">
                    <span class="nav-icon">◉</span>
                    Dashboard
                </a>
                <a href="/tools/email" class="nav-link">
                    <span class="nav-icon">📧</span>
                    Email Tool
                </a>
                <a href="/tools/cover-letter" class="nav-link">
                    <span class="nav-icon">📄</span>
                    Cover Letter Generator
                </a>
                <a href="/tools/clipboard" class="nav-link active">
                    <span class="nav-icon">📋</span>
                    Clipboard
                </a>
                <a href="/tools/tracker" class="nav-link">
                    <span class="nav-icon">📊</span>
                    Job Tracker
                </a>
            </nav>
        </aside>
        
        <!-- Top Bar -->
        <header class="topbar">
            <button class="sidebar-toggle" type="button" aria-label="Open menu" aria-expanded="false">
                <span></span><span></span><span></span>
            </button>
            <div class="topbar-actions">
                <a href="/logout" class="topbar-btn" title="Logout" aria-label="Logout">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                        <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/>
                        <polyline points="16 17 21 12 16 7"/>
                        <line x1="21" y1="12" x2="9" y2="12"/>
                    </svg>
                </a>
            </div>
        </header>
        <div class="sidebar-backdrop" aria-hidden="true"></div>
        
        <!-- Main Content -->
        <main class="main-content">
            <div class="content-wrapper">
                <!-- Page Header -->
                <header class="page-header">
                    <h1 class="page-title">Clipboard</h1>
                    <p class="page-subtitle">Save and copy text, links, and snippets with one click.</p>
                </header>
                
                <div class="clipboard-container">
                    <!-- Items List -->
                    <div class="items-section">
                        <div class="items-header">
                            <h3 class="items-title">Saved Items</h3>
                            <span id="itemsCount" class="items-count"></span>
                        </div>
                        <div id="itemsList" class="items-list">
                            <div class="empty-state">
                                <div class="empty-state-icon">📋</div>
                                <p class="empty-state-text">No items saved yet. Add your first item above.</p>
                            </div>
                        </div>
                    </div>

                    <!-- Add Item Card -->
                    <div class="add-item-card">
                        <div class="add-item-header">
                            <h2 class="add-item-title">Add New Item</h2>
                            <p class="add-item-subtitle">Save text, links, or any content for quick access.</p>
                        </div>
                        
                        <form id="addItemForm" class="add-item-form">
                            <div class="form-row">
                                <div class="form-group">
                                    <label class="form-label" for="itemLabel">Label</label>
                                    <input 
                                        type="text" 
                                        id="itemLabel" 
                                        name="label" 
                                        class="form-input" 
                                        placeholder="e.g. My LinkedIn"
                                        autocomplete="off"
                                    >
                                </div>
                                <div class="form-group">
                                    <label class="form-label" for="itemContent">Content</label>
                                    <input 
                                        type="text" 
                                        id="itemContent" 
                                        name="content" 
                                        class="form-input" 
                                        placeholder="Text, URL, or any content to save"
                                        autocomplete="off"
                                        required
                                    >
                                </div>
                            </div>
                            
                            <button type="submit" id="addBtn" class="btn btn-primary">
                                <span class="btn-text">Add to Clipboard</span>
                                <div class="btn-loader"></div>
                            </button>
                        </form>
                    </div>
                </div>
            </div>
        </main>
    </div>
    
    <script>
        let items = [];
        
        async function loadItems() {
            try {
                const response = await fetch('/api/clipboard');
                const data = await response.json();
                if (data.success) {
                    items = data.items || [];
                    renderItems();
                }
            } catch (error) {
                console.error('Failed to load items:', error);
            }
        }
        
        function renderItems() {
            const listEl = document.getElementById('itemsList');
            const countEl = document.getElementById('itemsCount');
            
            countEl.textContent = items.length > 0 ? `${items.length} item${items.length !== 1 ? 's' : ''}` : '';
            
            if (items.length === 0) {
                listEl.innerHTML = `
                    <div class="empty-state">
                        <div class="empty-state-icon">📋</div>
                        <p class="empty-state-text">No items saved yet. Add your first item above.</p>
                    </div>
                `;
                return;
            }
            
            listEl.innerHTML = items.map((item, index) => `
                <div class="clipboard-item" data-id="${item.id}">
                    <div class="item-info">
                        <p class="item-label">${escapeHtml(item.label || truncate(item.content, 50))}</p>
                        <p class="item-content">${escapeHtml(truncate(item.content, 100))}</p>
                    </div>
                    <div class="item-actions">
                        <button class="btn-icon-only btn-move" onclick="moveItem('${item.id}','up')" title="Move up" aria-label="Move up" ${index === 0 ? 'disabled' : ''}>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <polyline points="18 15 12 9 6 15"/>
                            </svg>
                        </button>
                        <button class="btn-icon-only btn-move" onclick="moveItem('${item.id}','down')" title="Move down" aria-label="Move down" ${index === items.length - 1 ? 'disabled' : ''}>
                            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                                <polyline points="6 9 12 15 18 9"/>
                            </svg>
                        </button>
                        <button class="btn-icon-only btn-copy" onclick="copyItem('${item.id}')" title="Copy to clipboard">
                            📋
                        </button>
                        <button class="btn-icon-only btn-delete" onclick="deleteItem('${item.id}')" title="Delete">
                            🗑
                        </button>
                    </div>
                </div>
            `).join('');
        }
        
        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }
        
        function truncate(text, maxLength) {
            if (text.length <= maxLength) return text;
            return text.substring(0, maxLength) + '...';
        }

        async function parseApiResponse(response) {
            const contentType = response.headers.get('content-type') || '';

            if (response.redirected || response.status === 401 || response.status === 403) {
                window.location.href = '/login';
                throw new Error('Authentication required');
            }

            if (!contentType.includes('application/json')) {
                const text = await response.text();
                throw new Error(text || `Unexpected response (${response.status})`);
            }

            return response.json();
        }

        async function copyTextToClipboard(text) {
            if (navigator.clipboard && window.isSecureContext) {
                await navigator.clipboard.writeText(text);
                return;
            }

            const textArea = document.createElement('textarea');
            textArea.value = text;
            textArea.style.position = 'fixed';
            textArea.style.left = '-9999px';
            textArea.style.top = '-9999px';
            document.body.appendChild(textArea);
            textArea.focus();
            textArea.select();

            const copied = document.execCommand('copy');
            document.body.removeChild(textArea);

            if (!copied) {
                throw new Error('Clipboard API unavailable and fallback copy failed');
            }
        }
        
        async function copyItem(id) {
            const item = items.find(i => i.id === id);
            if (!item) return;
            
            try {
                await copyTextToClipboard(item.content);
                
                const btn = document.querySelector(`.clipboard-item[data-id="${id}"] .btn-copy`);
                btn.classList.add('copied');
                btn.textContent = '✓';
                
                setTimeout(() => {
                    btn.classList.remove('copied');
                    btn.textContent = '📋';
                }, 1500);
            } catch (error) {
                console.error('Failed to copy:', error);
                alert('Failed to copy to clipboard');
            }
        }
        
        async function moveItem(id, direction) {
            try {
                const response = await fetch(`/api/clipboard/${encodeURIComponent(id)}/move`, {
                    method: 'PATCH',
                    headers: {
                        'Content-Type': 'application/json',
                        'Accept': 'application/json'
                    },
                    body: JSON.stringify({ direction })
                });

                const data = await parseApiResponse(response);
                if (!data.success) {
                    throw new Error(data.error || 'Move failed');
                }

                items = data.items || items;
                renderItems();
            } catch (error) {
                console.error('Failed to move:', error);
                alert('Failed to reorder item: ' + (error.message || 'Unknown error'));
            }
        }

        async function deleteItem(id) {
            try {
                const response = await fetch(`/api/clipboard/${encodeURIComponent(id)}`, {
                    method: 'DELETE',
                    headers: {
                        'Accept': 'application/json'
                    }
                });
                
                const data = await parseApiResponse(response);
                if (!data.success) {
                    throw new Error(data.error || 'Delete failed');
                }

                items = items.filter(i => i.id !== id);
                renderItems();
            } catch (error) {
                console.error('Failed to delete:', error);
                alert('Failed to delete item: ' + (error.message || 'Unknown error'));
            }
        }
        
        document.getElementById('addItemForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('addBtn');
            const label = document.getElementById('itemLabel').value.trim();
            const content = document.getElementById('itemContent').value;
            
            if (!content) return;
            
            btn.classList.add('loading');
            
            try {
                const response = await fetch('/api/clipboard', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ label, content })
                });
                
                const data = await response.json();
                if (data.success) {
                    items.unshift(data.item);
                    renderItems();
                    document.getElementById('addItemForm').reset();
                } else {
                    alert('Failed to add: ' + data.error);
                }
            } catch (error) {
                console.error('Failed to add:', error);
                alert('Failed to add item');
            } finally {
                btn.classList.remove('loading');
            }
        });
        
        loadItems();
    </script>
    <script src="/static/sidebar.js" defer></script>
</body>
</html>
