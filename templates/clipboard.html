<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clipboard - Asutosh's Dashboard</title>
    <link rel="stylesheet" href="/static/output.css">
    <script>if(localStorage.getItem('sidebar_collapsed')==='true'){document.documentElement.setAttribute('data-sidebar','collapsed')}</script>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen overflow-x-hidden">
    <div class="dashboard-layout flex min-h-screen">
        {{template "sidebar" "clipboard"}}
        <main class="main-content flex-1 ml-56 min-h-screen transition-all duration-200 min-w-0">
            <div class="content-wrapper max-w-5xl mx-auto px-6 py-8">
                <header class="page-header mb-8">
                    <h1 class="page-title text-2xl font-bold text-on-surface">Clipboard</h1>
                    <p class="page-subtitle text-on-surface-muted mt-1">Save and copy text, links, and snippets with one click.</p>
                </header>

                <div class="flex flex-col lg:flex-row gap-6">
                    <div class="flex-1">
                        <div class="flex items-center justify-between mb-4">
                            <h3 class="text-base font-semibold text-on-surface">Saved Items</h3>
                            <span id="itemsCount" class="text-sm text-on-surface-muted"></span>
                        </div>
                        <div class="mb-4">
                            <input type="text" id="searchInput" class="w-full px-3 py-2 rounded-lg bg-surface-high text-on-surface border border-outline focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary placeholder:text-on-surface-muted text-sm" placeholder="Search items..." autocomplete="off">
                        </div>
                        <div id="itemsList" class="space-y-2">
                            <div class="text-center py-12 text-on-surface-muted">
                                <div class="text-3xl mb-2">📋</div>
                                <p class="text-sm">No items saved yet. Add your first item.</p>
                            </div>
                        </div>
                    </div>

                    <div class="lg:w-80">
                        <div class="bg-surface-container rounded-xl p-6 border border-outline-variant sticky top-8">
                            <div class="mb-4">
                                <h2 class="text-lg font-semibold text-on-surface">Add New Item</h2>
                                <p class="text-sm text-on-surface-muted mt-1">Save text, links, or any content.</p>
                            </div>
                            <form id="addItemForm">
                                <div class="mb-4">
                                    <label class="block text-sm font-medium text-on-surface-variant mb-1" for="itemLabel">Label</label>
                                    <input type="text" id="itemLabel" class="w-full px-3 py-2 rounded-lg bg-surface-high text-on-surface border border-outline focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary placeholder:text-on-surface-muted text-sm" placeholder="e.g. My LinkedIn" autocomplete="off">
                                </div>
                                <div class="mb-4">
                                    <label class="block text-sm font-medium text-on-surface-variant mb-1" for="itemContent">Content</label>
                                    <input type="text" id="itemContent" class="w-full px-3 py-2 rounded-lg bg-surface-high text-on-surface border border-outline focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary placeholder:text-on-surface-muted text-sm" placeholder="Text, URL, or any content" autocomplete="off" required>
                                </div>
                                <button type="submit" id="addBtn" class="w-full inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-sm font-medium bg-primary text-on-primary-container hover:brightness-110 transition-all duration-150 cursor-pointer border-none">
                                    <span class="btn-text">Add to Clipboard</span>
                                    <div class="btn-loader hidden w-4 h-4 border-2 border-on-primary-container border-t-transparent rounded-full animate-spin"></div>
                                </button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </main>
    </div>
    <script>
    var itemsCache = [];
    function renderItems(items) {
        var list = document.getElementById('itemsList');
        var count = document.getElementById('itemsCount');
        if (!items || items.length === 0) {
            list.innerHTML = '<div class="text-center py-12 text-on-surface-muted"><div class="text-3xl mb-2">📋</div><p class="text-sm">No items saved yet.</p></div>';
            count.textContent = '';
            return;
        }
        count.textContent = items.length + ' item' + (items.length !== 1 ? 's' : '');
        list.innerHTML = items.map(function(item) {
            return '<div class="flex items-center gap-3 px-4 py-3 bg-surface-container rounded-lg border border-outline-variant group">' +
                '<div class="flex-1 min-w-0"><div class="text-sm font-medium text-on-surface truncate">' + escapeHtml(item.label || 'Untitled') + '</div>' +
                '<div class="text-xs text-on-surface-muted truncate mt-0.5">' + escapeHtml(item.content) + '</div></div>' +
                '<button onclick="copyItem(\'' + item.id + '\')" class="px-2 py-1 text-xs rounded bg-surface-high text-on-surface-variant hover:text-on-surface hover:bg-surface-highest transition-colors border-none cursor-pointer" title="Copy">📋</button>' +
                '<button onclick="deleteItem(\'' + item.id + '\')" class="px-2 py-1 text-xs rounded bg-surface-high text-error hover:bg-error-soft transition-colors border-none cursor-pointer" title="Delete">✕</button></div>';
        }).join('');
    }
    function loadItems(q) {
        var url = '/api/clipboard' + (q ? '?q=' + encodeURIComponent(q) : '');
        fetch(url).then(function(r) { return r.json(); }).then(function(d) {
            if (d.success && d.data) { itemsCache = d.data; renderItems(d.data); }
        });
    }
    function copyText(text) {
        if (navigator.clipboard && window.isSecureContext) {
            return navigator.clipboard.writeText(text);
        }
        return new Promise(function(resolve, reject) {
            var textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.setAttribute('readonly', '');
            textarea.style.position = 'fixed';
            textarea.style.top = '-1000px';
            textarea.style.left = '-1000px';
            document.body.appendChild(textarea);
            textarea.focus();
            textarea.select();
            try {
                var ok = document.execCommand('copy');
                document.body.removeChild(textarea);
                ok ? resolve() : reject(new Error('Copy command was not allowed'));
            } catch (err) {
                document.body.removeChild(textarea);
                reject(err);
            }
        });
    }
    function showCopyToast(message, type) {
        var toast = document.createElement('div');
        toast.className = 'fixed bottom-4 right-4 px-4 py-2 rounded-lg text-sm z-50 animate-fade-in ' + (type === 'success' ? 'bg-success-soft text-success' : 'bg-error-soft text-error');
        toast.textContent = message;
        document.body.appendChild(toast);
        setTimeout(function() { toast.remove(); }, 2000);
    }
    function copyItem(id) {
        var item = itemsCache.find(function(i) { return i.id === id; });
        if (!item || !item.content) return;
        copyText(item.content).then(function() {
            showCopyToast('Copied!', 'success');
        }).catch(function(err) {
            showCopyToast('Copy failed: ' + (err.message || 'Clipboard unavailable'), 'error');
        });
    }
    function deleteItem(id) {
        fetch('/api/clipboard/' + id, {method: 'DELETE'}).then(function(r) { return r.json(); }).then(function(d) {
            if (d.success) loadItems(document.getElementById('searchInput').value);
        });
    }
    document.getElementById('addItemForm').addEventListener('submit', function(e) {
        e.preventDefault();
        var btn = document.getElementById('addBtn');
        var label = document.getElementById('itemLabel').value;
        var content = document.getElementById('itemContent').value;
        if (!content) return;
        btn.querySelector('.btn-text').textContent = 'Saving...';
        btn.disabled = true;
        fetch('/api/clipboard', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({label: label, content: content})
        }).then(function(r) { return r.json(); }).then(function(d) {
            if (d.success) {
                document.getElementById('itemLabel').value = '';
                document.getElementById('itemContent').value = '';
                loadItems('');
            }
        }).finally(function() {
            btn.querySelector('.btn-text').textContent = 'Add to Clipboard';
            btn.disabled = false;
        });
    });
    document.getElementById('searchInput').addEventListener('input', function() {
        loadItems(this.value);
    });
    loadItems('');
    </script>
    <script src="/static/sidebar.js" defer></script>
</body>
</html>
