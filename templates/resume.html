<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resume Tailor - Asutosh's Dashboard</title>
    <link rel="stylesheet" href="/static/output.css">
    <script>if(localStorage.getItem('sidebar_collapsed')==='true'){document.documentElement.setAttribute('data-sidebar','collapsed')}</script>
    <style>
    :root {
        --surface-lowest: #09090b; --surface-low: #0c0c0e; --surface: #09090b;
        --surface-container: #18181b; --surface-high: #27272a; --surface-highest: #3f3f46;
        --on-surface: #fafafa; --on-surface-variant: #a1a1aa; --on-surface-muted: #71717a;
        --primary: #bec2ff; --primary-container: #8a94ff; --on-primary-container: #18181b;
        --outline: #52525b; --outline-variant: #27272a; --border: #27272a;
        --success: #22c55e; --success-soft: rgba(34,197,94,0.12);
        --error: #ef4444; --error-soft: rgba(239,68,68,0.12);
        --space-xs: 4px; --space-sm: 8px; --space-md: 16px; --space-lg: 24px; --space-xl: 32px;
        --radius-sm: 4px; --radius-md: 6px; --radius-lg: 8px; --radius-xl: 12px; --radius-full: 9999px;
    }
    .resume-split { display:flex; gap:0; height:100vh; overflow:hidden; }
    .resume-left { flex:0 0 45%; display:flex; flex-direction:column; overflow-y:auto; border-right:1px solid var(--border); padding:var(--space-lg); gap:var(--space-md); }
    .resume-right { flex:1; display:flex; flex-direction:column; overflow:hidden; background:var(--surface-lowest); position:relative; }
    .resume-right iframe { flex:1; width:100%; border:none; background:white; }
    .resize-handle { flex:0 0 4px; cursor:col-resize; background:var(--border); transition:background .15s; }
    .resize-handle:hover,.resize-handle.active { background:var(--primary-container); }
    .provider-row { display:flex; gap:var(--space-md); align-items:center; flex-wrap:wrap; }
    .provider-radio { display:flex; align-items:center; gap:6px; cursor:pointer; font-size:13px; color:var(--on-surface-variant); padding:6px 12px; border:1px solid var(--border); border-radius:var(--radius-md); background:var(--surface-low); transition:all .15s; }
    .provider-radio.active { color:var(--on-surface); border-color:var(--primary-container); background:rgba(138,148,255,.08); }
    .provider-config { display:flex; gap:var(--space-sm); align-items:center; flex-wrap:wrap; font-size:12px; padding:8px 12px; background:var(--surface-container); border-radius:var(--radius-md); border:1px solid var(--border); }
    .action-row { display:flex; gap:var(--space-sm); flex-wrap:wrap; }
    .score-display { display:flex; align-items:center; gap:var(--space-md); padding:var(--space-md); background:var(--surface-container); border:1px solid var(--border); border-radius:var(--radius-lg); }
    .score-badge { font-size:32px; font-weight:700; color:var(--primary); line-height:1; }
    .score-label { font-size:11px; color:var(--on-surface-muted); text-transform:uppercase; letter-spacing:.08em; font-weight:600; margin-bottom:4px; }
    .score-stars { color:#facc15; font-size:18px; letter-spacing:2px; }
    .keywords-row { display:flex; flex-wrap:wrap; gap:4px; }
    .keyword-tag { display:inline-block; padding:2px 8px; background:var(--surface-high); border-radius:var(--radius-full); font-size:11px; color:var(--on-surface-variant); }
    .analysis-box { padding:var(--space-md); background:var(--surface-container); border:1px solid var(--border); border-radius:var(--radius-lg); font-size:13px; line-height:1.6; color:var(--on-surface-variant); white-space:pre-wrap; }
    .chat-section { display:flex; flex-direction:column; flex:1; min-height:0; border-top:1px solid var(--border); padding-top:var(--space-md); margin-top:auto; }
    .chat-msgs { flex:1; overflow-y:auto; display:flex; flex-direction:column; gap:var(--space-sm); padding:var(--space-sm) 0; min-height:60px; max-height:200px; }
    .chat-msg { padding:6px 10px; border-radius:var(--radius-md); font-size:13px; line-height:1.5; max-width:95%; }
    .chat-msg.user { background:var(--surface-high); color:var(--on-surface); align-self:flex-end; }
    .chat-msg.assistant { background:var(--surface-container); color:var(--on-surface-variant); align-self:flex-start; border:1px solid var(--border); }
    .empty-pdf-state { display:flex; flex-direction:column; align-items:center; justify-content:center; height:100%; color:var(--on-surface-muted); gap:var(--space-md); text-align:center; padding:var(--space-xl); }
    .empty-pdf-state .icon { font-size:48px; opacity:.3; }
    .empty-pdf-state .text { font-size:14px; max-width:280px; line-height:1.5; }
    .jd-textarea { width:100%; resize:vertical; min-height:100px; background:var(--surface-low); border:1px solid var(--border); border-radius:var(--radius-md); padding:8px 12px; color:var(--on-surface); font-size:13px; font-family:inherit; box-sizing:border-box; }
    .jd-textarea:focus { outline:none; border-color:var(--primary-container); }
    @media (max-width:768px) {
        .resume-split { flex-direction:column; height:auto; min-height:100vh; }
        .resume-left { flex:none; border-right:none; border-bottom:1px solid var(--border); max-height:50vh; }
        .resume-right { min-height:60vh; }
        .resize-handle { display:none; }
    }
    </style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen">
<div class="dashboard-layout flex min-h-screen">
    {{template "sidebar" "resume"}}
    <main class="main-content flex-1 ml-56 min-h-screen transition-all duration-200" style="padding:0;overflow:hidden;">
        <div class="resume-split" id="resumeLayout">
            <div class="resume-left" id="leftPane">
                <div>
                    <div class="score-label">LLM Provider</div>
                    <div class="provider-row">
                        <label class="provider-radio active"><input type="radio" name="provider" value="ollama" checked> Ollama</label>
                        <label class="provider-radio"><input type="radio" name="provider" value="openrouter"> OpenRouter</label>
                    </div>
                    <div class="provider-config" id="ollamaConfig" style="margin-top:8px;">
                        <label>Host:</label>
                        <input type="text" id="ollamaHost" value="{{.OllamaHost}}" placeholder="host:port" style="background:var(--surface-lowest);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 8px;color:var(--on-surface);font-size:12px;width:140px;">
                        <label>Model:</label>
                        <input type="text" id="ollamaModel" value="{{.OllamaModel}}" placeholder="model name" style="background:var(--surface-lowest);border:1px solid var(--border);border-radius:var(--radius-sm);padding:4px 8px;color:var(--on-surface);font-size:12px;width:140px;">
                    </div>
                    <div class="provider-config" id="openrouterConfig" style="display:none;margin-top:8px;">
                        <span style="color:var(--on-surface-muted)">Using OPENROUTER_API_KEY from .env</span>
                    </div>
                </div>
                <div>
                    <div class="score-label">Company Name</div>
                    <input type="text" id="companyName" class="w-full bg-surface-low border border-outline rounded px-3 py-2 text-sm text-on-surface placeholder:text-on-surface-muted focus:outline-none focus:border-primary mt-1" placeholder="e.g. Google, OpenAI, Stripe" autocomplete="off" style="background:var(--surface-low);border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 12px;color:var(--on-surface);font-size:13px;">
                </div>
                <div>
                    <div class="score-label">Job Description</div>
                    <textarea id="jobDescription" class="jd-textarea" rows="6" placeholder="Paste the job description here..."></textarea>
                </div>
                <div class="flex gap-2 flex-wrap">
                    <button type="button" id="analyzeBtn" class="btn-primary inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-sm font-medium bg-primary text-on-primary-container hover:brightness-110 transition-all duration-150 cursor-pointer border-none flex-1 min-w-[100px]"><span>Analyze</span><span class="btn-loader hidden w-4 h-4 border-2 border-on-primary-container border-t-transparent rounded-full animate-spin"></span></button>
                    <button type="button" id="generateBtn" class="btn-light inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-sm font-medium bg-surface-high text-on-surface hover:bg-surface-highest transition-colors cursor-pointer border-none flex-1 min-w-[100px]" disabled><span>Generate</span><span class="btn-loader hidden w-4 h-4 border-2 border-on-surface border-t-transparent rounded-full animate-spin"></span></button>
                    <button type="button" id="downloadBtn" class="inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-sm font-medium bg-surface-high text-on-surface-variant hover:text-on-surface hover:bg-surface-highest transition-colors cursor-pointer border-none flex-1 min-w-[100px]" disabled><span>Download</span></button>
                </div>
                <div id="statusMessage" class="hidden px-4 py-3 rounded-lg text-sm"></div>
                <div id="resultsArea" style="display:none;">
                    <div class="score-display"><div><div class="score-label">ATS Score</div><div class="score-badge" id="scoreValue">-</div></div><div><div class="score-stars" id="scoreStars"></div><div style="font-size:12px;color:var(--on-surface-muted);margin-top:2px;" id="scoreArchetype"></div></div></div>
                    <div><div class="score-label">Keywords</div><div class="keywords-row" id="keywordsContainer" style="margin-top:4px;"></div></div>
                    <div><div class="score-label">Analysis</div><div class="analysis-box" id="analysisText" style="margin-top:4px;"></div></div>
                    <div><div class="score-label">Recommendations</div><div class="analysis-box" id="recommendationsText" style="margin-top:4px;"></div></div>
                    <div class="chat-section">
                        <div class="score-label">Chat — Suggest refinements</div>
                        <div class="chat-msgs" id="chatMessages"></div>
                        <div class="flex gap-2 items-end mt-2">
                            <textarea id="chatInput" rows="1" placeholder="Suggest a change..." style="flex:1;resize:none;min-height:36px;max-height:80px;background:var(--surface-low);border:1px solid var(--border);border-radius:var(--radius-md);padding:8px 12px;color:var(--on-surface);font-size:13px;font-family:inherit;"></textarea>
                            <button type="button" id="chatSendBtn" class="btn-primary inline-flex items-center justify-center gap-2 px-4 py-2 rounded-lg text-sm font-medium bg-primary text-on-primary-container hover:brightness-110 transition-all duration-150 cursor-pointer border-none" disabled><span>Send</span></button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="resize-handle" id="resizeHandle"></div>
            <div class="resume-right" id="rightPane">
                <div class="empty-pdf-state" id="emptyPdfState">
                    <div class="icon">📄</div>
                    <div class="text">Paste a job description on the left, click <strong>Analyze</strong>, then <strong>Generate</strong> to see your tailored resume preview here.</div>
                </div>
                <iframe id="pdfPreview" style="display:none;flex:1;width:100%;border:none;background:white;"></iframe>
            </div>
        </div>
    </main>
</div>
<script>/* keep existing JS from original - unchanged */
var currentState={score:0,keywords:[],analysis:'',recommendations:'',archetype:'',modifiedLatex:'',pdfBlob:null,chatHistory:[],companyName:'',jobDescription:'',provider:'ollama',model:document.getElementById('ollamaModel').value,ollamaHost:document.getElementById('ollamaHost').value,isGenerating:false,isAnalyzing:false,isChatting:false};
const $=(id)=>document.getElementById(id);
function showStatus(msg,type){const el=$('statusMessage');el.textContent=msg;el.classList.remove('hidden','bg-success-soft','text-success','bg-error-soft','text-error');el.classList.add('show');if(type==='success'){el.classList.add('bg-success-soft','text-success')}else if(type==='error'){el.classList.add('bg-error-soft','text-error')}}
function hideStatus(){const el=$('statusMessage');el.classList.add('hidden');el.classList.remove('show','bg-success-soft','text-success','bg-error-soft','text-error')}
function setLoading(btnId,loading){const btn=$(btnId);const loader=btn.querySelector('.btn-loader');if(loading){loader.classList.remove('hidden');btn.disabled=true}else{loader.classList.add('hidden');btn.disabled=false}}
function renderStars(score){let s='';for(let i=0;i<5;i++)s+=i<Math.floor(score)?'\u2605':'\u2606';return s}
function showResults(data){data=data||{};currentState.score=typeof data.score==='number'?data.score:0;currentState.keywords=data.keywords||[];currentState.analysis=data.analysis||'';currentState.recommendations=data.recommendations||'';currentState.archetype=data.archetype||'';$('resultsArea').style.display='block';$('scoreValue').textContent=currentState.score.toFixed(1)+'/5';$('scoreStars').textContent=renderStars(currentState.score);$('scoreArchetype').textContent=currentState.archetype||'';const kw=$('keywordsContainer');kw.innerHTML='';(data.keywords||[]).forEach(k=>{const t=document.createElement('span');t.className='keyword-tag';t.textContent=k;kw.appendChild(t)});$('analysisText').textContent=data.analysis||'';$('recommendationsText').textContent=data.recommendations||'';$('generateBtn').disabled=false;$('chatSendBtn').disabled=false}
function showPdfPreview(pdfBlob){if(currentState.pdfBlob)URL.revokeObjectURL(currentState.pdfBlob);currentState.pdfBlob=pdfBlob;const url=URL.createObjectURL(pdfBlob);const iframe=$('pdfPreview');iframe.src=url;iframe.style.display='flex';$('emptyPdfState').style.display='none';$('downloadBtn').disabled=false}
function addChatMessage(role,content){const c=$('chatMessages');const m=document.createElement('div');m.className='chat-msg '+role;m.textContent=content;c.appendChild(m);c.scrollTop=c.scrollHeight}
async function handleAnalyze(){const jd=$('jobDescription').value.trim();if(!jd){showStatus('Please paste a job description.','error');return}currentState.jobDescription=jd;currentState.companyName=$('companyName').value.trim();hideStatus();setLoading('analyzeBtn',true);currentState.isAnalyzing=true;try{const resp=await fetch('/api/resume/analyze',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_description:jd,provider:currentState.provider,model:currentState.model,ollama_host:currentState.ollamaHost})});const result=await resp.json();if(!resp.ok||!result.success){showStatus('Error: '+(result.error||'Analysis failed'),'error');return}showResults(result.data);const score=typeof result.data.score==='number'?result.data.score:0;showStatus('Analysis complete! Score: '+score.toFixed(1)+'/5','success')}catch(err){showStatus('Failed: '+err.message,'error')}finally{setLoading('analyzeBtn',false);currentState.isAnalyzing=false}}
async function handleGenerate(){if(!currentState.jobDescription){showStatus('Please analyze first.','error');return}hideStatus();setLoading('generateBtn',true);currentState.isGenerating=true;try{const resp=await fetch('/api/resume/generate',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({job_description:currentState.jobDescription})});const result=await resp.json();if(!resp.ok||!result.success){showStatus('Error: '+(result.error||'Generation failed'),'error');return}currentState.modifiedLatex=result.data.modified_latex;showStatus('Skills updated! Check the LaTeX preview.','success');addChatMessage('assistant','Skills section has been tailored to match the job description.')}catch(err){showStatus('Failed: '+err.message,'error')}finally{setLoading('generateBtn',false);currentState.isGenerating=false}}
async function handleDownload(){if(!currentState.pdfBlob){showStatus('No PDF to download.','error');return}const company=currentState.companyName||'TAILORED';const safe=company.replace(/ /g,'_').replace(/[\/\\]/g,'_');const url=URL.createObjectURL(currentState.pdfBlob);const a=document.createElement('a');a.href=url;a.download='RESUME_'+safe+'.pdf';document.body.appendChild(a);a.click();URL.revokeObjectURL(url);a.remove();showStatus('Downloaded!','success')}
async function handleChatSend(){const input=$('chatInput');const msg=input.value.trim();if(!msg)return;if(!currentState.modifiedLatex){showStatus('Generate first.','error');return}input.value='';hideStatus();setLoading('chatSendBtn',true);currentState.isChatting=true;currentState.chatHistory.push({role:'user',content:msg});addChatMessage('user',msg);try{const resp=await fetch('/api/resume/chat',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({message:msg,chat_history:currentState.chatHistory,current_latex:currentState.modifiedLatex,job_description:currentState.jobDescription,provider:currentState.provider,model:currentState.model,ollama_host:currentState.ollamaHost})});const result=await resp.json();if(!resp.ok||!result.success){showStatus('Error','error');currentState.chatHistory.push({role:'assistant',content:'Error'});addChatMessage('assistant','Error');return}currentState.modifiedLatex=result.data.modified_latex;currentState.chatHistory.push({role:'assistant',content:result.data.response_text});addChatMessage('assistant',result.data.response_text);const pdfResp=await fetch('/api/resume/compile',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({latex_source:result.data.modified_latex})});if(pdfResp.ok){const pdfBlob=await pdfResp.blob();showPdfPreview(pdfBlob)}}catch(err){showStatus('Failed: '+err.message,'error')}finally{setLoading('chatSendBtn',false);currentState.isChatting=false}}
document.querySelectorAll('input[name="provider"]').forEach(r=>{r.addEventListener('change',function(){currentState.provider=this.value;document.querySelectorAll('.provider-radio').forEach(e=>e.classList.remove('active'));this.closest('.provider-radio').classList.add('active');$('ollamaConfig').style.display=this.value==='ollama'?'flex':'none';$('openrouterConfig').style.display=this.value==='openrouter'?'block':'none'})});
$('ollamaHost').addEventListener('change',function(){currentState.ollamaHost=this.value.trim()});
$('ollamaModel').addEventListener('change',function(){currentState.model=this.value.trim()});
$('analyzeBtn').addEventListener('click',handleAnalyze);$('generateBtn').addEventListener('click',handleGenerate);$('downloadBtn').addEventListener('click',handleDownload);$('chatSendBtn').addEventListener('click',handleChatSend);
$('chatInput').addEventListener('keydown',function(e){if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();handleChatSend()}});
$('chatInput').addEventListener('input',function(){this.style.height='auto';this.style.height=Math.min(this.scrollHeight,80)+'px'});
const leftPane=$('leftPane');const resizeHandle=$('resizeHandle');let isResizing=false;
resizeHandle.addEventListener('mousedown',function(e){isResizing=true;this.classList.add('active');document.body.style.cursor='col-resize';document.body.style.userSelect='none'});
document.addEventListener('mousemove',function(e){if(!isResizing)return;const layout=$('resumeLayout');const rect=layout.getBoundingClientRect();let pct=((e.clientX-rect.left)/rect.width)*100;pct=Math.max(25,Math.min(65,pct));leftPane.style.flex='0 0 '+pct+'%'});
document.addEventListener('mouseup',function(){if(isResizing){isResizing=false;resizeHandle.classList.remove('active');document.body.style.cursor='';document.body.style.userSelect=''}});
</script>
<script src="/static/sidebar.js" defer></script>
</body>
</html>
