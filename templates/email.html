<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Sender - Asutosh's Dashboard</title>
    <link rel="stylesheet" href="/static/output.css">
    <script>if(localStorage.getItem('sidebar_collapsed')==='true'){document.documentElement.setAttribute('data-sidebar','collapsed')}</script>
    <style>.preload,.preload *{transition:none!important}html[data-sidebar="collapsed"] .sidebar{width:3.5rem!important;transform:translateX(0)!important}html[data-sidebar="collapsed"] .sidebar .nav-text,html[data-sidebar="collapsed"] .sidebar .sidebar-brand,html[data-sidebar="collapsed"] .sidebar .sidebar-footer .nav-text{display:none!important}html[data-sidebar="collapsed"] .sidebar .sidebar-header{justify-content:center}html[data-sidebar="collapsed"] .sidebar .sidebar-header,html[data-sidebar="collapsed"] .sidebar .sidebar-nav{padding-left:.75rem!important;padding-right:.75rem!important}html[data-sidebar="collapsed"] .sidebar .nav-link{justify-content:center;padding-left:.5rem!important;padding-right:.5rem!important}html[data-sidebar="collapsed"] .main-content{margin-left:3.5rem!important}</style>
</head>
<body class="bg-surface text-on-surface antialiased min-h-screen overflow-x-hidden">
    <div class="dashboard-layout flex min-h-screen">
        {{template "sidebar" "email"}}
        <main class="main-content flex-1 ml-56 min-h-screen transition-all duration-200 min-w-0">
            <div class="content-wrapper max-w-3xl mx-auto px-6 py-8">
                <header class="page-header mb-8">
                    <h1 class="page-title text-2xl font-bold text-on-surface">Email Sender</h1>
                    <p class="page-subtitle text-on-surface-muted mt-1">Send personalized job application emails with your resume attached.</p>
                </header>

                <div class="bg-surface-container rounded-xl p-6 border border-outline-variant">
                    <div class="mb-6">
                        <h2 class="text-lg font-semibold text-on-surface">Send Application</h2>
                        <p class="text-sm text-on-surface-muted mt-1">Fill in details below to send a bespoke job application.</p>
                    </div>
                    <form id="emailForm">
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-on-surface-variant mb-1" for="senderKey">Sender Account</label>
                            <select id="senderKey" class="w-full px-3 py-2 rounded-lg bg-surface-high text-on-surface border border-outline focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary text-sm" required>
                                <option value="university" selected>University Gmail (Default)</option>
                                <option value="personal">Personal Gmail</option>
                            </select>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-on-surface-variant mb-1" for="templateKey">Email Template</label>
                            <select id="templateKey" class="w-full px-3 py-2 rounded-lg bg-surface-high text-on-surface border border-outline focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary text-sm" required>
                                <option value="referral" selected>Loading templates...</option>
                            </select>
                        </div>
                        <div id="roleField" class="mb-4 hidden">
                            <label class="block text-sm font-medium text-on-surface-variant mb-1" for="rolePosition">Role / Position</label>
                            <input type="text" id="rolePosition" class="w-full px-3 py-2 rounded-lg bg-surface-high text-on-surface border border-outline focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary placeholder:text-on-surface-muted text-sm" placeholder="e.g. ML Engineer" autocomplete="off">
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-on-surface-variant mb-1" for="personName">Recipient's Name</label>
                            <input type="text" id="personName" class="w-full px-3 py-2 rounded-lg bg-surface-high text-on-surface border border-outline focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary placeholder:text-on-surface-muted text-sm" placeholder="e.g. John Smith" autocomplete="off" required>
                        </div>
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-on-surface-variant mb-1" for="companyName">Target Company</label>
                            <input type="text" id="companyName" class="w-full px-3 py-2 rounded-lg bg-surface-high text-on-surface border border-outline focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary placeholder:text-on-surface-muted text-sm" placeholder="e.g. Google" autocomplete="off" required>
                        </div>
                        <div class="mb-6">
                            <label class="block text-sm font-medium text-on-surface-variant mb-1" for="emailAddress">Recipient's Email</label>
                            <input type="email" id="emailAddress" class="w-full px-3 py-2 rounded-lg bg-surface-high text-on-surface border border-outline focus:border-primary focus:outline-none focus:ring-1 focus:ring-primary placeholder:text-on-surface-muted text-sm" placeholder="e.g. john@company.com" autocomplete="off" required>
                        </div>
                        <button type="submit" id="submitBtn" class="w-full inline-flex items-center justify-center gap-2 px-4 py-2.5 rounded-lg text-sm font-medium bg-primary text-on-primary-container hover:brightness-110 transition-all duration-150 cursor-pointer border-none">
                            <span class="btn-text">Send Application</span>
                            <div class="btn-loader hidden w-4 h-4 border-2 border-on-primary-container border-t-transparent rounded-full animate-spin"></div>
                        </button>
                    </form>
                    <div id="statusMessage" class="mt-4 px-4 py-3 rounded-lg text-sm hidden"></div>
                </div>
            </div>
        </main>
    </div>
    <script>
    (function() {
        var templateSelect = document.getElementById('templateKey');
        var roleField = document.getElementById('roleField');
        var roleInput = document.getElementById('rolePosition');
        var submitBtn = document.getElementById('submitBtn');
        var templateMeta = {};

        function toggleRoleField() {
            var selected = templateSelect.value;
            var meta = templateMeta[selected];
            if (meta && meta.uses_role) {
                roleField.classList.remove('hidden');
                roleInput.setAttribute('required', '');
            } else {
                roleField.classList.add('hidden');
                roleInput.removeAttribute('required');
                roleInput.value = '';
            }
            validateForm();
        }

        function validateForm() {
            var name = document.getElementById('personName').value.trim();
            var company = document.getElementById('companyName').value.trim();
            var email = document.getElementById('emailAddress').value.trim();
            var valid = name !== '' && company !== '' && email !== '' && templateSelect.value !== '';
            if (!roleField.classList.contains('hidden')) {
                valid = valid && roleInput.value.trim() !== '';
            }
            submitBtn.disabled = !valid;
        }

        fetch('/email-templates').then(function(r) { return r.json(); }).then(function(d) {
            templateSelect.innerHTML = '';
            if (d.templates && d.templates.length > 0) {
                d.templates.forEach(function(t) {
                    templateMeta[t.key] = t;
                    var opt = document.createElement('option');
                    opt.value = t.key;
                    opt.textContent = t.name;
                    templateSelect.appendChild(opt);
                });
                templateSelect.value = 'referral';
                toggleRoleField();
            }
        }).catch(function() {
            templateSelect.innerHTML = '<option value="referral">Referral Request</option>';
        });

        templateSelect.addEventListener('change', toggleRoleField);
        document.getElementById('personName').addEventListener('input', validateForm);
        document.getElementById('companyName').addEventListener('input', validateForm);
        document.getElementById('emailAddress').addEventListener('input', validateForm);
        roleInput.addEventListener('input', validateForm);

        document.getElementById('emailForm').addEventListener('submit', function(e) {
            e.preventDefault();
            if (submitBtn.disabled) return;
            var btn = document.getElementById('submitBtn');
            var status = document.getElementById('statusMessage');
            var loader = btn.querySelector('.btn-loader');
            btn.querySelector('.btn-text').textContent = 'Sending...';
            loader.classList.remove('hidden');
            btn.disabled = true;
            status.className = 'mt-4 px-4 py-3 rounded-lg text-sm hidden';
            var payload = {
                name: document.getElementById('personName').value.trim(),
                company: document.getElementById('companyName').value.trim(),
                email: document.getElementById('emailAddress').value.trim(),
                sender_key: document.getElementById('senderKey').value,
                template_key: document.getElementById('templateKey').value
            };
            if (!roleField.classList.contains('hidden')) {
                payload.role = roleInput.value.trim();
            }
            fetch('/send-email', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(payload)
            }).then(function(r) { return r.json(); }).then(function(d) {
                status.className = 'mt-4 px-4 py-3 rounded-lg text-sm ' + (d.success ? 'bg-success-soft text-success' : 'bg-error-soft text-error');
                status.textContent = d.message || d.error || 'Something went wrong.';
                status.classList.remove('hidden');
            }).catch(function() {
                status.className = 'mt-4 px-4 py-3 rounded-lg text-sm bg-error-soft text-error';
                status.textContent = 'Network error.';
                status.classList.remove('hidden');
            }).finally(function() {
                btn.querySelector('.btn-text').textContent = 'Send Application';
                loader.classList.add('hidden');
                validateForm();
            });
        });

        validateForm();
    })();
    </script>
    <script src="/static/sidebar.js" defer></script>
</body>
</html>
